[project]
name = "ayan-engine"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "“rovsenrza”", email = "rovsen.rzayev.2009@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pyproj>=3.8.0",
    "pytest>=9.1.1",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ayan-engine = "ayan_engine:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
